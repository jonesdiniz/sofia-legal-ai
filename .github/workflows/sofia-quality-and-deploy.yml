name: Sofia quality and Supabase deploy

on:
  pull_request:
    paths:
      - ".github/workflows/sofia-quality-and-deploy.yml"
      - "deno.lock"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "supabase/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sofia-quality-and-deploy.yml"
      - "deno.lock"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "supabase/**"
  workflow_dispatch:

jobs:
  quality:
    name: Lint, tests, build and Edge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - run: npm ci
      - run: npm run quality

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        run: deno check supabase/functions/chat-agent/index.ts supabase/functions/send-lead-notification/index.ts supabase/functions/health-monitor/index.ts

  deploy:
    name: Apply Supabase changes
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
